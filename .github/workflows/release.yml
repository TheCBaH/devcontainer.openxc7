name: release
on:
  push:
    tags: ['v*']
permissions:
  actions: read
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download artifacts of the validated build
        run: |
          run=$(gh run list --workflow build.yml --event push \
            --commit "$GITHUB_SHA" --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          if test -z "$run"; then
            echo "No successful build of $GITHUB_SHA" >&2
            exit 1
          fi
          echo "Publishing artifacts of build run $run"
          gh run download "$run" -p 'runtime-linux-*-musl' -p 'database-*' -D artifacts
          duplicates=$(find artifacts -type f -printf '%f\n' | sort | uniq -d)
          if test -n "$duplicates"; then
            echo "Duplicate artifact files: $duplicates" >&2
            exit 1
          fi
          mkdir dist
          find artifacts -type f -exec mv -t dist {} +
      - name: Tag the validated runtime image
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          image=ghcr.io/thecbah/devcontainer.openxc7
          for arch in amd64 arm64; do
            docker buildx imagetools create -t "$image:$GITHUB_REF_NAME-$arch" \
              "$image:runtime-$GITHUB_SHA-$arch"
          done
          docker buildx imagetools create -t "$image:$GITHUB_REF_NAME" "$image:runtime-$GITHUB_SHA"
      - name: Publish validated runtime
        run: |
          (cd dist; sha256sum *.tar.xz *.json *.txt *.log.xz > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" \
            --notes 'Static musl x86_64 and ARM64 tools with separate CPU-independent Xilinx 7-series device databases. Xz archives, sources, manifests and checksums. Databases validated on both CPUs, offline on Debian and Alpine.'
