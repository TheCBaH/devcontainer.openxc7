name: images
on:
  workflow_call:
    outputs:
      image:
        value: ${{ jobs.devcontainer.outputs.image }}
permissions:
  contents: read
  packages: write
jobs:
  devcontainer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/cache/restore@v6
        id: deps
        with:
          path: .deps
          key: deps-${{ runner.arch }}-${{ hashFiles('versions.env', 'scripts/fetch-dependencies.sh') }}
      - name: Download pinned dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: scripts/fetch-dependencies.sh
      - uses: actions/cache/save@v6
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: .deps
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Development container
        id: container
        uses: TheCBaH/devcontainer-action/devcontainer@v1
        with:
          cli-version: '0.88.0'
          post-create: 'false'
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check cached build dependencies
        run: ${{ steps.container.outputs.exec }} bash -c '$CXX --version; bazel --version; test -f /opt/sdk/lib/gcc/$(uname -m)-unknown-linux-musl/16.2.0/libgomp.a'
      - name: Dependency image reference
        id: image
        run: |
          repo=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          tag=$(echo "$GITHUB_REF_NAME" | tr '[:upper:].' '[:lower:]_')
          echo "image=ghcr.io/$repo/devcontainer-ARCH:$tag" >> "$GITHUB_OUTPUT"
